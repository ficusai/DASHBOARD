name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            libgirepository1.0-dev libcairo2-dev

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm 01_build/00_dashboard.spec

      - name: Rename artifact
        run: |
          mv dist/dashboard dist/dashboard-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux-x86_64
          path: dist/dashboard-linux-x86_64

  create-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dashboard-linux-x86_64
          generate_release_notes: true
